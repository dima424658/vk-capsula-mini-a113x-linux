%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/awinic,aw21036.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW21036 LED controller

maintainers:
  - Dmitry Pankov <dmitry@enula.ru>

description: |
  The AW21036 is a 36-channel LED controller connected over I2C. Each
  channel is exposed as an individual LED class device.

properties:
  compatible:
    const: awinic,aw21036

  reg:
    maxItems: 1

  enable-gpios:
    maxItems: 1
    description: Active-high hardware enable input.

  awinic,global-current:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 255
    description: Global current control value written to the GCCR register.

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^led@[0-9a-f]+$":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false
    properties:
      reg:
        description: AW21036 channel number, from 1 to 36.
        items:
          minimum: 1
          maximum: 36

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        led-controller@34 {
            compatible = "awinic,aw21036";
            reg = <0x34>;
            awinic,global-current = <128>;
            #address-cells = <1>;
            #size-cells = <0>;

            led@1 {
                reg = <1>;
                label = "clock:d2:d";
            };
        };
    };
